name: Deploy to Railway

on:
  push:
    branches:
      - main      # production
      - dev       # preview
  workflow_dispatch:  # manual trigger

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    name: Deploy to Railway (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --no-tree-shake-icons

      # Copy server.py into build output (Railway runs Python to serve static files)
      - name: Copy server script
        run: cp server.py build/web/server.py

      # ── Deploy to Railway ─────────────────────────────────────────────────
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        run: |
          RAILWAY_ENV="${{ github.ref_name == 'main' && 'production' || 'dev' }}"
          echo "Deploying to Railway (${{ github.ref_name }}) → env=$RAILWAY_ENV..."
          cd build/web
          railway link \
            --project ${{ vars.RAILWAY_PROJECT_ID }} \
            --environment "$RAILWAY_ENV"
          railway up \
            --service pawprint \
            --detach \
            --no-gitignore \
            --message "Deploy ${{ github.ref_name }}: ${{ github.sha }}"
          echo "url=https://pawprint.up.railway.app" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ── Wait + health check ───────────────────────────────────────────────
      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          URL="https://pawprint.up.railway.app"
          echo "Checking: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS — Railway may still be starting up"
          else
            echo "✓ App is live at $URL"
          fi
