name: Deploy to Railway

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "app/**"      # Flutter source → trigger build
      - "Dockerfile"  # Dockerfile change → Railway rebuilds
  workflow_dispatch:  # manual trigger

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  deploy:
    name: Build & Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Build Flutter web
        run: |
          cd app
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      - name: Copy server.py into built output
        run: cp server.py app/build/web/server.py

      - name: Commit & push built output
        run: |
          # Stage built web output
          git add app/build/web/ || true

          # Check if there's anything to commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "ci: build web $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git push
          fi

      # Railway auto-deploys on push to main/dev via GitHub integration.
      # If manual trigger, show instructions.
      - name: Railway status
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Manual deploy triggered. Railway should auto-deploy from the pushed commit."
          echo "Check: https://railway.app/project/5980c116-966e-47a1-9abd-65e6b98cdfce"

      - id: deploy
        name: Set deployment URL
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=https://pawprint.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://pawprint-dev.up.railway.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Railway to deploy
        if: github.event_name != 'workflow_dispatch'
        run: sleep 20

      - name: Health check
        run: |
          URL="${{ github.ref_name == 'main' && 'https://pawprint.up.railway.app' || 'https://pawprint-dev.up.railway.app' }}"
          echo "Checking: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30 --retry 3 --retry-delay 5)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✓ App is live at $URL"
          else
            echo "::warning::Health check returned $STATUS — Railway may still be starting up"
          fi
