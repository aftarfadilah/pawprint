name: Deploy to Railway

on:
  push:
    branches:
      - main      # production
      - dev       # preview
  workflow_dispatch:  # manual trigger

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy:
    name: Deploy to Railway (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --no-tree-shake-icons

      # Copy server.py and deploy script into build output
      - name: Copy runtime files
        run: |
          cp server.py build/web/server.py
          cp railway_api.py build/web/railway_api.py

      - name: Deploy to Railway
        id: deploy
        working-directory: build/web
        run: |
          # Set environment IDs based on branch
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Deploying to PRODUCTION..."
            export RAILWAY_ENV_ID="dc99abf3-3eb5-406b-8cbe-db2631264298"
          else
            echo "Deploying to DEV..."
            export RAILWAY_ENV_ID="78e05a69-a114-4974-8cc3-fdfa43b92048"
          fi
          export RAILWAY_PROJECT_ID="${{ vars.RAILWAY_PROJECT_ID }}"
          export RAILWAY_SERVICE_ID="408e43a0-8468-43c9-b1a6-6c2c1da44cb6"
          export RAILWAY_REFRESH_TOKEN="${{ secrets.RAILWAY_REFRESH_TOKEN }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          export GITHUB_SHA="${{ github.sha }}"

          echo "env ID: $RAILWAY_ENV_ID"
          echo "service ID: $RAILWAY_SERVICE_ID"

          # Run Python deployer
          python3 railway_api.py

          echo "url=https://pawprint.up.railway.app" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # ── Wait + health check ───────────────────────────────────────────────
      - name: Wait for deployment
        run: sleep 15

      - name: Health check
        run: |
          URL="https://pawprint.up.railway.app"
          echo "Checking: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Health check returned $STATUS — Railway may still be starting up"
          else
            echo "✓ App is live at $URL"
          fi
