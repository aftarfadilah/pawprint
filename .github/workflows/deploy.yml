name: Deploy to Railway

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "app/**"      # Flutter source → trigger build
      - "Dockerfile"  # Dockerfile change → Railway rebuilds
  workflow_dispatch:  # manual trigger

env:
  FLUTTER_VERSION: "3.44.8"

permissions:
  contents: write  # needed to push built web output + read commit info

jobs:
  deploy:
    name: Build & Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Build Flutter web
        run: |
          cd app
          flutter pub get
          flutter build web --release --no-tree-shake-icons

      - name: Copy server.py into built output
        run: cp server.py app/build/web/server.py

      - name: Commit & push built output
        id: commit
        run: |
          # Stage built web output (force-add to override any gitignore entries)
          git add -f app/build/web/ || true

          # Check if there's anything to commit
          if git diff --cached --quiet; then
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            echo "did_commit=true" >> "$GITHUB_OUTPUT"
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "ci: build web $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      # Railway: refresh token → get access token → deploymentRedeploy
      - name: Trigger Railway deployment
        if: steps.commit.outputs.did_commit == 'true'
        run: |
          # Refresh Railway token
          TOKEN_RESP=$(curl -s -X POST https://backboard.railway.com/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "refresh_token=${{ secrets.RAILWAY_REFRESH_TOKEN }}&grant_type=refresh_token&client_id=railway__front-end")

          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # Trigger Railway deployment via GraphQL mutation
          MUTATION='{"query":"mutation { deploymentRedeploy(id: \"'${{ vars.RAILWAY_DEPLOYMENT_ID }}') { id status } }"}'

          curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -d "$MUTATION" | python3 -c "import sys,json; r=json.load(sys.stdin); print('Railway deployment triggered:', r)"

          echo "Waiting 60s for Railway to start building..."
          sleep 60

      - id: deploy
        name: Set deployment URL
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=https://pawprint.up.railway.app" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://pawprint-dev.up.railway.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Railway to deploy
        if: steps.commit.outputs.did_commit == 'true'
        run: sleep 30

      - name: Health check
        run: |
          URL="${{ github.ref_name == 'main' && 'https://pawprint.up.railway.app' || 'https://pawprint-dev.up.railway.app' }}"
          echo "Checking: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30 --retry 3 --retry-delay 5)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✓ App is live at $URL"
          else
            echo "::warning::Health check returned $STATUS — Railway may still be starting up"
          fi
