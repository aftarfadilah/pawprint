# nginx.conf — used if you ever switch from Python to nginx serve.
# Keep for reference; Railway serves HTTPS externally so no SSL cert needed here.

server {
    listen 8080;
    root /app;
    index index.html;

    # Flutter web SPA — serve index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /flutter_bootstrap.js {
        expires 1h;
    }
}
